name: Keepalive

# 公开仓库的定时工作流在仓库 60 天无活动后会被 GitHub 自动禁用。
# 每月一次的空提交保持仓库活跃，防止 sync.yml 的 schedule 被停用。
# 本仓库本身不含任何敏感信息（清单是 yexi-by/dsh-unrestricted，公开可见），
# 且此 job 跑在公开仓库上，不消耗私有 Actions 分钟额度。

on:
  schedule:
    - cron: "23 4 1 * *" # 每月 1 日 UTC 04:23（北京时间 12:23）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit timestamp
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet && echo "No change needed" && exit 0
          git commit -m "chore: keepalive $(cat .keepalive)"
          git push
