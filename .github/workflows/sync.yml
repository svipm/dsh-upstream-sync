name: Sync dsh-unrestricted from upstream

on:
  schedule:
    # 每 6 小时运行一次（UTC 00:17 / 06:17 / 12:17 / 18:17；北京时间 08:17 / 14:17 / 20:17 / 02:17）
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dsh-unrestricted
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo (for upstream-lock.json)
        uses: actions/checkout@v4

      - name: Verify upstream identity (anti-squatting lock)
        env:
          UPSTREAM: yexi-by/dsh-unrestricted
        run: |
          set -euo pipefail
          expected=$(jq -r .repo_id upstream-lock.json)
          actual=$(curl -fsS "https://api.github.com/repos/${UPSTREAM}" | jq -r .id)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Upstream repo ID mismatch: lock expects ${expected}, API returned ${actual}. The repo at this name may have been deleted and re-registered. Sync aborted; mirror is preserved."
            exit 1
          fi
          echo "Upstream identity verified (repo id ${actual})."

      - name: Checkout private mirror
        uses: actions/checkout@v4
        with:
          repository: svipm/dsh-unrestricted
          ref: master
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Sync from yexi-by/dsh-unrestricted
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yexi-by/dsh-unrestricted.git 2>/dev/null || git remote set-url upstream https://github.com/yexi-by/dsh-unrestricted.git

          if ! git fetch --prune --tags upstream master; then
            echo "::error::Fetch from upstream failed. Upstream may be deleted, renamed, or network-restricted. The private mirror is untouched; investigate manually."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/master)" ]; then
            echo "Already up to date: $(git rev-parse --short HEAD)"
            exit 0
          fi

          echo "Syncing $(git rev-parse --short HEAD) -> $(git rev-parse --short upstream/master)"
          git reset --hard upstream/master
          git push --force origin HEAD:master
          git push --force origin 'refs/tags/*:refs/tags/*'
          echo "Done. Mirror now at $(git rev-parse --short upstream/master)."
